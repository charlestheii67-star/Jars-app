<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles for Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" />

  <!-- 3D Film & Camera Aperture Motif -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowTeal)" stroke-width="6" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#glowRed)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Mask / 3D Avatar Center Motif -->
  <path d="M 200 180 L 312 180 C 330 240, 310 320, 256 350 C 202 320, 182 240, 200 180 Z" fill="#18181b" stroke="#ef4444" stroke-width="6" />

  <!-- Mask eye slits -->
  <polygon points="216,220 240,230 220,240" fill="#ef4444" />
  <polygon points="296,220 272,230 292,240" fill="#ef4444" />

  <!-- Mask breathing vents -->
  <circle cx="240" cy="280" r="4" fill="#a1a1aa" />
  <circle cx="256" cy="280" r="4" fill="#a1a1aa" />
  <circle cx="272" cy="280" r="4" fill="#a1a1aa" />
  <circle cx="248" cy="296" r="4" fill="#a1a1aa" />
  <circle cx="264" cy="296" r="4" fill="#a1a1aa" />

  <!-- 3D Cinema Corner Accents -->
  <path d="M 96 144 L 144 96 M 96 96 L 96 144 L 144 144" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 416 144 L 368 96 M 416 96 L 416 144 L 368 144" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 96 368 L 144 416 M 96 416 L 96 368 L 144 368" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 416 368 L 368 416 M 416 416 L 416 368 L 368 368" fill="none" stroke="#06b6d4" stroke-width="4" />

  <!-- 3D Lettering -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">JARS 3D</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="6">STUDIO</text>
</svg>
