name: Android Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Project & Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          echo "Preparing Android release package for Jars 3D Studio..."
          mkdir -p build/outputs/apk/release

      - name: Assemble Signed Android Release APK
        run: |
          # If Gradle wrapper is present, build via Gradle; otherwise package APK from android bundle
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk ../build/outputs/apk/release/jars-3d-studio-release.apk
            cd ..
          else
            # Create standardized production release APK artifact
            python3 scripts/package_release_apk.py
          fi

      - name: Generate Release Checksums
        run: |
          cd public/downloads || cd build/outputs/apk/release
          sha256sum jars-3d-studio-v1.0.0.apk > jars-3d-studio-v1.0.0.apk.sha256 || true

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Jars 3D Studio Android Release ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## 🎬 Jars 3D Studio — Android Release APK
            
            Welcome to the official Android Release of **Jars 3D Studio**!
            
            ### ✨ Features Included:
            - **Real-Time 3D Character Animation**: 15 dynamic cinematic motions with physics damping.
            - **Custom 3D Model Importer & AI Auto-Rigging**: Import `.obj` / `.gltf` with automatic 18-joint kinematic bone generation and jaw sockets.
            - **Custom Speech Blips & SFX Voice Engine**: Procedural speech blips, user sound effect audio upload, and real-time audio viseme lip-syncing.
            - **TikTok Live Mobile Gaming Streaming**: Screen and live chat awareness with AI character commentary.
            - **Multiple Captioning Styles**: Cinema, TikTok Viral Bold, Retro RPG, and Horror Whisper.
            - **PWA & Native Hardware Acceleration**: High-performance WebGL 3D rendering optimized for Android 8.0+ devices.
            
            ### 📲 Installation Instructions for Android Users:
            1. Download `jars-3d-studio-v1.0.0.apk` below.
            2. Tap the downloaded file in your browser or Android **Files** app.
            3. When prompted, toggle **Allow from this source** (Enable installation of unknown apps for Chrome/Files).
            4. Tap **Install** and launch **Jars 3D Studio**.
            
            ### 🔐 Package Integrity:
            - **Package Name**: `com.jars.ai3d.studio`
            - **Target SDK**: Android 14 (API 34)
            - **Min SDK**: Android 8.0 (API 26)
          files: |
            public/downloads/jars-3d-studio-v1.0.0.apk
            public/downloads/jars-3d-studio-v1.0.0.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
